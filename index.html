<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>にこちゃんの健康管理アプリ</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
      background-color: #EAF4FB;
      background-image: radial-gradient(circle, #AACDE8 1.5px, transparent 1.5px);
      background-size: 20px 20px;
      min-height: 100vh;
      color: #2C3E50;
    }

    /* ══ ヘッダー ══ */
    header {
      background: #5B9BD5;
      color: white;
      padding: 20px 16px 16px;
      text-align: center;
      box-shadow: 0 4px 0 #2D6A9F;
    }
    header h1 { font-size: 1.25rem; font-weight: bold; letter-spacing: 0.04em; margin-bottom: 4px; }
    header p  { font-size: 0.76rem; opacity: 0.92; }

    /* ══ 年ナビ ══ */
    .year-nav {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 10px 16px;
      background: #DEEEFF;
      border-bottom: 3px solid #5B9BD5;
    }
    .year-nav button {
      background: white; border: 2.5px solid #5B9BD5; border-radius: 50px;
      padding: 5px 16px; font-size: 0.95rem; cursor: pointer;
      color: #2D6A9F; font-family: inherit; font-weight: bold;
      box-shadow: 0 3px 0 #5B9BD5;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .year-nav button:active { transform: translateY(3px); box-shadow: none; }
    .year-nav-label { font-size: 0.95rem; font-weight: bold; color: #2D6A9F; min-width: 70px; text-align: center; }

    /* ══ フィラリア進捗 ══ */
    .filaria-bar {
      background: white; margin: 10px 10px 0;
      padding: 12px 14px 14px; border-radius: 16px;
      border: 3px solid #00ACC1; box-shadow: 0 3px 0 #00838F;
    }
    .filaria-bar-title { font-size: 0.74rem; font-weight: bold; color: #00695C; margin-bottom: 10px; text-align: center; }
    .filaria-chips { display: flex; gap: 5px; justify-content: center; }
    .f-chip {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 0.62rem; color: #aaa; min-width: 30px;
      padding: 5px 4px; border-radius: 10px;
      background: #F5F5F5; border: 2px solid #E0E0E0; font-weight: bold;
    }
    .f-chip .f-ico { font-size: 1.05rem; }
    .f-chip.done { background: #B2EBF2; border-color: #00ACC1; color: #006064; }

    /* ══ 月ナビ ══ */
    .month-nav {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 12px 16px; margin: 10px 10px 0;
      background: white; border-radius: 16px;
      border: 3px solid #5B9BD5; box-shadow: 0 3px 0 #2D6A9F;
    }
    .month-nav button {
      background: #5B9BD5; border: none; border-radius: 50px;
      padding: 9px 20px; font-size: 1.1rem; cursor: pointer; color: white;
      font-family: inherit; font-weight: bold;
      box-shadow: 0 4px 0 #2D6A9F;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .month-nav button:active { transform: translateY(4px); box-shadow: none; }
    .month-nav-label { font-size: 1.1rem; font-weight: bold; color: #333; min-width: 115px; text-align: center; }

    /* ══ カレンダー ══ */
    .calendar { padding: 10px 10px 14px; }
    .cal-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 5px; }
    .cal-header-cell { text-align: center; font-size: 0.68rem; padding: 3px 0; font-weight: bold; color: #999; }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-cell {
      background: white; border-radius: 10px; min-height: 62px;
      padding: 5px 2px 4px; text-align: center;
      cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
      border: 2px solid #D6EAF8; transition: transform 0.1s;
    }
    .cal-cell:active { transform: scale(0.86); }
    .cal-cell.empty  { background: transparent; border-color: transparent; pointer-events: none; }
    .cal-cell.today  { background: #D6EAF8; border: 2.5px solid #5B9BD5; box-shadow: 0 2px 0 #2D6A9F; }
    .cal-cell.has-data { background: #EBF5FB; border-color: #85C1E9; }
    .cal-cell.today.has-data { background: #D6EAF8; border-color: #5B9BD5; }

    .cal-date { font-size: 0.8rem; font-weight: bold; color: #555; line-height: 1.5; }
    .cal-dots { display: flex; justify-content: center; gap: 2px; margin-top: 3px; flex-wrap: wrap; }
    .cal-dot  { width: 7px; height: 7px; border-radius: 50%; }
    .dot-filaria { background: #00ACC1; }
    .dot-weight  { background: #5B9BD5; }
    .dot-health  { background: #26A69A; }
    .dot-alert   { background: #E53935; }
    .cal-camera  { font-size: 0.72rem; line-height: 1; margin-top: 3px; }

    /* ══ 凡例 ══ */
    .legend {
      display: flex; gap: 8px; justify-content: center;
      padding: 6px 16px 14px; flex-wrap: wrap;
    }
    .legend-item {
      display: flex; align-items: center; gap: 4px;
      font-size: 0.65rem; color: #777;
      background: white; border-radius: 20px;
      padding: 3px 9px; border: 1.5px solid #D6EAF8;
    }

    /* ══ モーダル ══ */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(20, 60, 100, 0.4);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: #F0F8FF;
      border-radius: 24px 24px 0 0;
      border-top: 4px solid #5B9BD5;
      padding: 16px 14px 36px;
      width: 100%; max-width: 480px;
      animation: slideUp 0.22s ease-out;
      max-height: 92vh; overflow-y: auto;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    .modal-drag { width: 44px; height: 5px; background: #5B9BD5; border-radius: 3px; margin: 0 auto 14px; }
    .modal-title { font-size: 1.05rem; font-weight: bold; color: #2D6A9F; margin-bottom: 2px; text-align: center; }
    .modal-sub   { font-size: 0.7rem; color: #AAA; margin-bottom: 12px; text-align: center; }

    /* セクションカード */
    .sec-card { border-radius: 16px; padding: 12px 12px 10px; margin-bottom: 10px; }
    .sec-filaria { background: #E0F7FA; border: 3px solid #00ACC1; }
    .sec-weight  { background: #DDEEFF; border: 3px solid #5B9BD5; }
    .sec-food    { background: #EDE7F6; border: 3px solid #7E57C2; }
    .sec-water   { background: #E1F5FE; border: 3px solid #0288D1; }
    .sec-urine   { background: #E8EAF6; border: 3px solid #3F51B5; }
    .sec-walk    { background: #E0F2F1; border: 3px solid #00897B; }
    .sec-photo   { background: #FFF3E0; border: 3px solid #FF9800; }
    .sec-memo    { background: #FFF9C4; border: 3px solid #F9A825; }

    .sec-label {
      font-size: 0.84rem; font-weight: bold; margin-bottom: 10px;
      display: flex; align-items: center; gap: 5px;
    }
    .sec-filaria .sec-label { color: #006064; }
    .sec-weight  .sec-label { color: #1565C0; }
    .sec-food    .sec-label { color: #4527A0; }
    .sec-water   .sec-label { color: #01579B; }
    .sec-urine   .sec-label { color: #1A237E; }
    .sec-walk    .sec-label { color: #004D40; }
    .sec-photo   .sec-label { color: #E65100; }
    .sec-memo    .sec-label { color: #F57F17; }

    /* フィラリアトグル */
    .filaria-toggle {
      display: flex; align-items: center; gap: 10px; cursor: pointer;
      background: white; border-radius: 12px; padding: 10px 12px;
      border: 2px solid #80DEEA;
    }
    .filaria-toggle input[type=checkbox] { width: 22px; height: 22px; accent-color: #00ACC1; cursor: pointer; flex-shrink: 0; }
    .filaria-toggle-label { font-size: 0.88rem; color: #006064; font-weight: bold; }

    /* 体重ステッパー */
    .weight-enable-row {
      display: flex; align-items: center; gap: 10px; cursor: pointer;
      background: white; border-radius: 12px; padding: 10px 12px;
      border: 2px solid #90CAF9;
    }
    .weight-enable-row input[type=checkbox] { width: 22px; height: 22px; accent-color: #5B9BD5; cursor: pointer; flex-shrink: 0; }
    .weight-enable-label { font-size: 0.88rem; color: #1565C0; font-weight: bold; }
    .weight-stepper {
      display: flex; align-items: center; justify-content: center;
      gap: 14px; margin-top: 12px;
    }
    .weight-stepper.hidden { display: none; }
    .wt-btn {
      width: 46px; height: 46px; border-radius: 50%;
      border: 2.5px solid #5B9BD5; background: white; color: #2D6A9F;
      font-size: 1.5rem; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 0 #2D6A9F;
      transition: transform 0.1s, box-shadow 0.1s; line-height: 1;
    }
    .wt-btn:active { transform: translateY(3px); box-shadow: none; }
    .wt-display {
      background: white; border: 2.5px solid #5B9BD5;
      border-radius: 14px; padding: 8px 18px;
      min-width: 110px; text-align: center;
      box-shadow: 0 3px 0 #2D6A9F;
    }
    .wt-val  { font-size: 1.5rem; font-weight: bold; color: #2D6A9F; }
    .wt-unit { font-size: 0.82rem; color: #888; margin-left: 2px; }

    /* 選択ボタン共通 */
    .btn-group { display: flex; flex-wrap: wrap; gap: 5px; }
    .btn-choice {
      flex: 1 1 auto; min-width: calc(33% - 4px);
      padding: 9px 4px; border-radius: 12px;
      font-size: 0.73rem; font-family: inherit;
      cursor: pointer; text-align: center; line-height: 1.4;
      border: 2px solid #DDD; background: white; color: #666;
      box-shadow: 0 2px 0 #CCC;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-choice:active { transform: translateY(2px); box-shadow: none; }

    .sec-food  .btn-choice.selected { background: #7E57C2; border-color: #4527A0; color: white; font-weight: bold; box-shadow: 0 3px 0 #311B92; }
    .sec-water .btn-choice.selected { background: #0288D1; border-color: #01579B; color: white; font-weight: bold; box-shadow: 0 3px 0 #01579B; }
    .sec-urine .btn-choice.selected { background: #3F51B5; border-color: #1A237E; color: white; font-weight: bold; box-shadow: 0 3px 0 #0D47A1; }
    .sec-walk  .btn-choice.selected { background: #00897B; border-color: #004D40; color: white; font-weight: bold; box-shadow: 0 3px 0 #00251A; }
    .btn-choice.alert-choice.selected {
      background: #E53935 !important; border-color: #B71C1C !important;
      color: white !important; box-shadow: 0 3px 0 #7F0000 !important;
    }

    /* 写真 */
    .photo-preview {
      border-radius: 12px; overflow: hidden;
      border: 2.5px solid #FF9800; margin-bottom: 10px;
      position: relative;
    }
    .photo-preview.hidden { display: none; }
    .photo-preview img { width: 100%; max-height: 220px; object-fit: cover; display: block; }
    .photo-remove-btn {
      position: absolute; top: 8px; right: 8px;
      background: rgba(0,0,0,0.65); color: white;
      border: none; border-radius: 20px;
      padding: 5px 12px; font-size: 0.76rem;
      cursor: pointer; font-family: inherit; font-weight: bold;
    }
    .photo-add-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: white; border: 2.5px dashed #FF9800;
      border-radius: 12px; padding: 16px 12px;
      cursor: pointer; color: #E65100;
      font-weight: bold; font-size: 0.9rem; width: 100%;
    }
    .photo-add-btn:active { opacity: 0.7; }
    .photo-upload-progress { font-size: 0.78rem; color: #FF9800; text-align: center; margin-top: 6px; min-height: 18px; font-weight: bold; }

    /* テキストエリア */
    .modal textarea {
      width: 100%; padding: 10px 12px;
      border: 2.5px solid #F9A825; border-radius: 12px;
      font-size: 0.88rem; font-family: inherit;
      resize: none; height: 68px; background: white;
    }
    .modal textarea:focus { outline: none; border-color: #F57F17; }

    /* アクションボタン */
    .modal-actions { display: flex; gap: 10px; margin-top: 12px; }
    .modal-btn {
      flex: 1; padding: 14px; border: none; border-radius: 16px;
      font-size: 0.94rem; font-weight: bold; font-family: inherit; cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .modal-btn:active { transform: translateY(3px); box-shadow: none !important; }
    .modal-btn.primary { background: #5B9BD5; color: white; box-shadow: 0 5px 0 #2D6A9F; font-size: 1rem; letter-spacing: 0.05em; }
    .modal-btn.danger  { background: #FFCDD2; color: #C62828; border: 2px solid #EF9A9A; box-shadow: 0 3px 0 #EF9A9A; }
    .modal-btn.cancel  { background: #EEE; color: #888; box-shadow: 0 3px 0 #CCC; }

    /* 接続状態 */
    .conn-pill {
      position: fixed; bottom: 14px; right: 14px;
      padding: 7px 14px; border-radius: 20px;
      font-size: 0.7rem; font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 50;
    }
    .conn-ok      { background: #B2EBF2; color: #006064; border: 2px solid #00ACC1; }
    .conn-error   { background: #FFCDD2; color: #B71C1C; border: 2px solid #EF5350; }
    .conn-loading { background: #DDEEFF; color: #1565C0; border: 2px solid #5B9BD5; }
    .spinner {
      display: inline-block; width: 11px; height: 11px;
      border: 2px solid #90CAF9; border-top-color: #5B9BD5;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 3px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ══ 月次サマリー＆日別一覧 ══ */
    .month-summary { padding: 0 10px 28px; }

    .summary-card {
      background: white; border-radius: 16px;
      border: 3px solid #5B9BD5; box-shadow: 0 3px 0 #2D6A9F;
      padding: 14px 14px 12px; margin-bottom: 12px;
    }
    .summary-card-title {
      font-size: 0.88rem; font-weight: bold; color: #2D6A9F;
      margin-bottom: 12px; display: flex; align-items: center; gap: 5px;
    }
    .summary-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .s-item {
      background: #EBF4FF; border-radius: 12px;
      padding: 8px 12px; text-align: center;
      min-width: 64px; border: 2px solid #AACDE8;
    }
    .s-item.s-alert { background: #FFEBEE; border-color: #EF9A9A; }
    .s-val { font-size: 1.1rem; font-weight: bold; color: #1565C0; line-height: 1.3; }
    .s-item.s-alert .s-val { color: #C62828; }
    .s-lbl { font-size: 0.62rem; color: #999; margin-top: 2px; }

    .daylist-title {
      font-size: 0.88rem; font-weight: bold; color: #2D6A9F;
      margin-bottom: 8px; display: flex; align-items: center; gap: 5px;
    }
    .day-item {
      background: white; border-radius: 14px;
      border: 2px solid #D6EAF8; padding: 10px 12px;
      margin-bottom: 7px; cursor: pointer;
      transition: opacity 0.1s;
    }
    .day-item:active { opacity: 0.65; }
    .day-item.day-alert { border-color: #FFCDD2; background: #FFF8F8; }
    .day-item-hd {
      display: flex; align-items: center; gap: 6px; margin-bottom: 7px;
    }
    .day-item-date { font-size: 0.85rem; font-weight: bold; color: #2D6A9F; flex: 1; }
    .day-edit-hint { font-size: 0.7rem; color: #BBBBBB; }
    .day-badges { display: flex; flex-wrap: wrap; gap: 4px; }
    .dbadge {
      font-size: 0.68rem; padding: 3px 8px; border-radius: 20px; font-weight: bold;
    }
    .db-filaria { background: #B2EBF2; color: #006064; }
    .db-weight  { background: #BBDEFB; color: #1565C0; }
    .db-food    { background: #EDE7F6; color: #4527A0; }
    .db-water   { background: #B3E5FC; color: #01579B; }
    .db-urine   { background: #C5CAE9; color: #1A237E; }
    .db-walk    { background: #DCEDC8; color: #33691E; }
    .db-photo   { background: #FFE0B2; color: #E65100; }
    .db-memo    { background: #FFF9C4; color: #F57F17; }
    .db-alert   { background: #FFCDD2 !important; color: #B71C1C !important; }

    .no-records {
      text-align: center; color: #BBB; font-size: 0.82rem;
      padding: 24px 0; background: white; border-radius: 14px;
      border: 2px dashed #D6EAF8;
    }
  </style>
</head>
<body>

<header>
  <h1>🐾 にこちゃんの健康管理アプリ</h1>
  <p>🌸 毎日の健康・フィラリア投薬を記録します 🌸</p>
</header>

<div class="year-nav">
  <button id="prevYear">◀</button>
  <div class="year-nav-label" id="yearLabel"></div>
  <button id="nextYear">▶</button>
</div>

<div class="filaria-bar">
  <div class="filaria-bar-title">💊 フィラリア投薬チェック（5月〜12月）</div>
  <div class="filaria-chips" id="filariaChips"></div>
</div>

<div class="month-nav">
  <button id="prevMonth">◀</button>
  <div class="month-nav-label" id="monthLabel"></div>
  <button id="nextMonth">▶</button>
</div>

<div class="calendar">
  <div class="cal-header">
    <div class="cal-header-cell" style="color:#E53935">日</div>
    <div class="cal-header-cell">月</div>
    <div class="cal-header-cell">火</div>
    <div class="cal-header-cell">水</div>
    <div class="cal-header-cell">木</div>
    <div class="cal-header-cell">金</div>
    <div class="cal-header-cell" style="color:#1E88E5">土</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<div class="legend">
  <div class="legend-item"><span class="cal-dot dot-filaria" style="display:inline-block"></span>フィラリア</div>
  <div class="legend-item"><span class="cal-dot dot-weight"  style="display:inline-block"></span>体重</div>
  <div class="legend-item"><span class="cal-dot dot-health"  style="display:inline-block"></span>健康記録</div>
  <div class="legend-item"><span class="cal-dot dot-alert"   style="display:inline-block"></span>要注意</div>
  <div class="legend-item">📷 写真あり</div>
</div>

<!-- 月次サマリー＆日別一覧 -->
<div class="month-summary" id="monthSummary"></div>

<!-- モーダル -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" id="modalBody">
    <div class="modal-drag"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-sub">✏️ 記録する項目を入力してください（すべて任意）</div>

    <div class="sec-card sec-filaria">
      <div class="sec-label">💊 フィラリア投薬</div>
      <label class="filaria-toggle">
        <input type="checkbox" id="filariaCheck">
        <span class="filaria-toggle-label">今日フィラリアを投薬した 🐶</span>
      </label>
    </div>

    <div class="sec-card sec-weight">
      <div class="sec-label">⚖️ 体重</div>
      <label class="weight-enable-row">
        <input type="checkbox" id="weightEnable">
        <span class="weight-enable-label">体重を記録する</span>
      </label>
      <div class="weight-stepper hidden" id="weightStepper">
        <button class="wt-btn" id="weightMinus">－</button>
        <div class="wt-display">
          <span class="wt-val" id="weightValue">7.5</span><span class="wt-unit">kg</span>
        </div>
        <button class="wt-btn" id="weightPlus">＋</button>
      </div>
    </div>

    <div class="sec-card sec-food">
      <div class="sec-label">🍽️ 食事量</div>
      <div class="btn-group" id="foodGroup">
        <button class="btn-choice" data-val="かなりよく食べた">🤩 かなりよく食べた</button>
        <button class="btn-choice" data-val="よく食べた">😋 よく食べた</button>
        <button class="btn-choice" data-val="普通">👍 普通</button>
        <button class="btn-choice" data-val="少なめ">😐 少なめ</button>
        <button class="btn-choice alert-choice" data-val="食べなかった">😟 食べなかった</button>
      </div>
    </div>

    <div class="sec-card sec-water">
      <div class="sec-label">💧 水の摂取量</div>
      <div class="btn-group" id="waterGroup">
        <button class="btn-choice" data-val="かなり多い">💦 かなり多い</button>
        <button class="btn-choice" data-val="多い">💧 多い</button>
        <button class="btn-choice" data-val="普通">👍 普通</button>
        <button class="btn-choice" data-val="少なめ">😐 少なめ</button>
        <button class="btn-choice alert-choice" data-val="飲まなかった">😟 飲まなかった</button>
      </div>
    </div>

    <div class="sec-card sec-urine">
      <div class="sec-label">🚽 おしっこの様子</div>
      <div class="btn-group" id="urineGroup">
        <button class="btn-choice" data-val="かなり多い">💦 かなり多い</button>
        <button class="btn-choice" data-val="多い">🌊 多い</button>
        <button class="btn-choice" data-val="普通">👍 普通</button>
        <button class="btn-choice" data-val="少ない">😐 少ない</button>
        <button class="btn-choice alert-choice" data-val="血尿あり">🚨 血尿あり</button>
      </div>
    </div>

    <div class="sec-card sec-walk">
      <div class="sec-label">🦮 散歩の様子</div>
      <div class="btn-group" id="walkGroup">
        <button class="btn-choice" data-val="かなり元気いっぱい">🏃 かなり元気いっぱい</button>
        <button class="btn-choice" data-val="元気いっぱい">😄 元気いっぱい</button>
        <button class="btn-choice" data-val="普通">👍 普通</button>
        <button class="btn-choice" data-val="乗り気じゃない">😐 乗り気じゃない</button>
        <button class="btn-choice alert-choice" data-val="行きたがらない">😟 行きたがらない</button>
      </div>
    </div>

    <div class="sec-card sec-photo">
      <div class="sec-label">📷 写真</div>
      <div class="photo-preview hidden" id="photoPreview">
        <img id="photoImg" src="" alt="記録写真">
        <button class="photo-remove-btn" id="photoRemoveBtn">✕ 削除</button>
      </div>
      <label class="photo-add-btn" id="photoAddBtn">
        <input type="file" id="photoInput" accept="image/*" style="display:none">
        📷 写真を追加・変更する
      </label>
      <div class="photo-upload-progress" id="photoProgress"></div>
    </div>

    <div class="sec-card sec-memo">
      <div class="sec-label">📋 その他体調メモ</div>
      <textarea id="healthMemoInput" placeholder="例：元気がなかった、嘔吐があった など"></textarea>
    </div>

    <div class="modal-actions">
      <button class="modal-btn cancel" id="modalCancel">キャンセル</button>
      <button class="modal-btn danger" id="deleteBtn" style="display:none">🗑️ 削除</button>
      <button class="modal-btn primary" id="saveBtn">✨ 記録する</button>
    </div>
  </div>
</div>

<div class="conn-pill conn-loading" id="connPill">
  <span class="spinner"></span>接続中...
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC7vuZFKeHjnt_Z3mPOIGId8gV1698CYao",
  authDomain: "denwa-toban-report.firebaseapp.com",
  projectId: "denwa-toban-report",
  storageBucket: "denwa-toban-report.firebasestorage.app",
  messagingSenderId: "416564829020",
  appId: "1:416564829020:web:922f2f88b6cc78c3297f99"
};

const MONTH_JP       = ['','1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const DOW_JP         = ['日','月','火','水','木','金','土'];
const FILARIA_MONTHS = [5,6,7,8,9,10,11,12];
const DEFAULT_WEIGHT = 7.5;

const todayObj = new Date();
const todayKey = fmt(todayObj.getFullYear(), todayObj.getMonth()+1, todayObj.getDate());

let currentYear  = todayObj.getFullYear();
let currentMonth = todayObj.getMonth() + 1;
let currentModalDate = null;
let dayCache = {};
let unsubListener = null;
let weightVal = DEFAULT_WEIGHT;

let currentPhotoUrl  = null;
let currentPhotoFile = null;
let photoRemoved     = false;

firebase.initializeApp(FIREBASE_CONFIG);
const db      = firebase.firestore();
const storage = firebase.storage();

// ---- 選択ボタン ----
['foodGroup','waterGroup','urineGroup','walkGroup'].forEach(gid => {
  document.getElementById(gid).querySelectorAll('.btn-choice').forEach(btn => {
    btn.addEventListener('click', () => {
      const was = btn.classList.contains('selected');
      document.getElementById(gid).querySelectorAll('.btn-choice').forEach(b => b.classList.remove('selected'));
      if (!was) btn.classList.add('selected');
    });
  });
});
function getChoice(gid) {
  const s = document.getElementById(gid).querySelector('.btn-choice.selected');
  return s ? s.dataset.val : null;
}
function setChoice(gid, val) {
  document.getElementById(gid).querySelectorAll('.btn-choice').forEach(b => {
    b.classList.toggle('selected', b.dataset.val === val);
  });
}

// ---- 体重ステッパー ----
const weightEnableEl  = document.getElementById('weightEnable');
const weightStepperEl = document.getElementById('weightStepper');
const weightValueEl   = document.getElementById('weightValue');

weightEnableEl.addEventListener('change', () => {
  weightStepperEl.classList.toggle('hidden', !weightEnableEl.checked);
});
document.getElementById('weightMinus').addEventListener('click', () => {
  weightVal = Math.round((weightVal - 0.1) * 10) / 10;
  if (weightVal < 0) weightVal = 0;
  weightValueEl.textContent = weightVal.toFixed(1);
});
document.getElementById('weightPlus').addEventListener('click', () => {
  weightVal = Math.round((weightVal + 0.1) * 10) / 10;
  if (weightVal > 99.9) weightVal = 99.9;
  weightValueEl.textContent = weightVal.toFixed(1);
});
function setWeightState(saved) {
  if (saved) {
    weightVal = parseFloat(saved);
    weightEnableEl.checked = true;
    weightStepperEl.classList.remove('hidden');
  } else {
    weightVal = DEFAULT_WEIGHT;
    weightEnableEl.checked = false;
    weightStepperEl.classList.add('hidden');
  }
  weightValueEl.textContent = weightVal.toFixed(1);
}

// ---- 写真 ----
const photoPreviewEl  = document.getElementById('photoPreview');
const photoImgEl      = document.getElementById('photoImg');
const photoAddBtnEl   = document.getElementById('photoAddBtn');
const photoProgressEl = document.getElementById('photoProgress');

document.getElementById('photoInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { alert('10MB以下の画像を選択してください。'); e.target.value = ''; return; }
  currentPhotoFile = file;
  photoRemoved = false;
  const reader = new FileReader();
  reader.onload = ev => {
    photoImgEl.src = ev.target.result;
    photoPreviewEl.classList.remove('hidden');
    photoAddBtnEl.style.display = 'none';
  };
  reader.readAsDataURL(file);
});

document.getElementById('photoRemoveBtn').addEventListener('click', () => {
  currentPhotoFile = null;
  photoRemoved = true;
  photoPreviewEl.classList.add('hidden');
  photoAddBtnEl.style.display = '';
  document.getElementById('photoInput').value = '';
  photoImgEl.src = '';
});

function setPhotoState(url) {
  currentPhotoUrl = url || null;
  currentPhotoFile = null;
  photoRemoved = false;
  photoProgressEl.textContent = '';
  if (url) {
    photoImgEl.src = url;
    photoPreviewEl.classList.remove('hidden');
    photoAddBtnEl.style.display = 'none';
  } else {
    photoPreviewEl.classList.add('hidden');
    photoAddBtnEl.style.display = '';
    document.getElementById('photoInput').value = '';
  }
}

async function handlePhotoSave() {
  if (photoRemoved && currentPhotoUrl) {
    try { await storage.refFromURL(currentPhotoUrl).delete(); } catch(e) { /* 無視 */ }
    return null;
  }
  if (currentPhotoFile) {
    photoProgressEl.textContent = '📤 アップロード中...';
    const ref = storage.ref(`filaria-images/${currentModalDate}/image`);
    await ref.put(currentPhotoFile);
    const url = await ref.getDownloadURL();
    photoProgressEl.textContent = '';
    return url;
  }
  return currentPhotoUrl;
}

function fmt(y, m, d) {
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

// ---- Firestore ----
function loadYearData() {
  if (unsubListener) { unsubListener(); unsubListener = null; }
  dayCache = {};
  setConn('loading', '<span class="spinner"></span>接続中...');

  unsubListener = db.collection('filaria')
    .orderBy(firebase.firestore.FieldPath.documentId())
    .startAt(`${currentYear}-01-01`)
    .endAt(`${currentYear}-12-31`)
    .onSnapshot(
      snap => {
        dayCache = {};
        snap.forEach(doc => {
          if (/^\d{4}-\d{2}-\d{2}$/.test(doc.id)) dayCache[doc.id] = doc.data();
        });
        renderFilariaChips();
        renderCalendar();
        renderMonthSummary();
        setConn('ok', '✅ 接続済み');
      },
      err => { console.error(err); setConn('error', '❌ 接続エラー'); }
    );
}

function renderFilariaChips() {
  document.getElementById('yearLabel').textContent = `${currentYear}年`;
  const wrap = document.getElementById('filariaChips');
  wrap.innerHTML = '';
  FILARIA_MONTHS.forEach(m => {
    const prefix = `${currentYear}-${String(m).padStart(2,'0')}-`;
    const done = Object.keys(dayCache).some(k => k.startsWith(prefix) && dayCache[k].filaria);
    const chip = document.createElement('div');
    chip.className = 'f-chip' + (done ? ' done' : '');
    chip.innerHTML = `<span class="f-ico">${done ? '✅' : '⬜'}</span><span>${m}月</span>`;
    wrap.appendChild(chip);
  });
}

// ---- 月次サマリー＆日別一覧 ----
function renderMonthSummary() {
  const container = document.getElementById('monthSummary');
  const prefix = `${currentYear}-${String(currentMonth).padStart(2,'0')}-`;
  const records = Object.entries(dayCache)
    .filter(([k]) => k.startsWith(prefix))
    .sort(([a],[b]) => a.localeCompare(b));

  if (records.length === 0) {
    container.innerHTML = `<div class="no-records">📭 この月の記録はまだありません</div>`;
    return;
  }

  // ---- 集計 ----
  const totalDays   = records.length;
  const filariaCount = records.filter(([,r]) => r.filaria).length;
  const weights     = records.filter(([,r]) => r.weight).map(([,r]) => parseFloat(r.weight));
  const avgWeight   = weights.length ? (weights.reduce((s,v) => s+v, 0)/weights.length).toFixed(1) : null;
  const latestWeight = weights.length ? weights[weights.length-1].toFixed(1) : null;
  const alertDays   = records.filter(([,r]) =>
    r.food==='食べなかった' || r.water==='飲まなかった' || r.urine==='血尿あり' || r.walk==='行きたがらない'
  ).length;
  const photoDays   = records.filter(([,r]) => r.imageUrl).length;

  let summaryHTML = `
    <div class="summary-card">
      <div class="summary-card-title">📊 今月の集計</div>
      <div class="summary-grid">
        <div class="s-item"><div class="s-val">${totalDays}日</div><div class="s-lbl">記録日数</div></div>
        <div class="s-item"><div class="s-val">${filariaCount}回</div><div class="s-lbl">💊 投薬</div></div>
        ${latestWeight ? `<div class="s-item"><div class="s-val">${latestWeight}kg</div><div class="s-lbl">⚖️ 最新体重</div></div>` : ''}
        ${avgWeight && weights.length > 1 ? `<div class="s-item"><div class="s-val">${avgWeight}kg</div><div class="s-lbl">⚖️ 平均体重</div></div>` : ''}
        ${alertDays > 0 ? `<div class="s-item s-alert"><div class="s-val">${alertDays}日</div><div class="s-lbl">⚠️ 要注意</div></div>` : ''}
        ${photoDays > 0 ? `<div class="s-item"><div class="s-val">${photoDays}枚</div><div class="s-lbl">📷 写真</div></div>` : ''}
      </div>
    </div>
  `;

  // ---- 日別一覧 ----
  let listHTML = `<div class="daylist-title">📋 日別記録一覧</div>`;

  for (const [key, rec] of records) {
    const d   = parseInt(key.split('-')[2]);
    const dow = DOW_JP[new Date(currentYear, currentMonth-1, d).getDay()];
    const isAlert = rec.food==='食べなかった' || rec.water==='飲まなかった' || rec.urine==='血尿あり' || rec.walk==='行きたがらない';

    let badges = '';
    if (rec.filaria)    badges += `<span class="dbadge db-filaria">💊 投薬済み</span>`;
    if (rec.weight)     badges += `<span class="dbadge db-weight">⚖️ ${rec.weight}kg</span>`;
    if (rec.food)       badges += `<span class="dbadge db-food${rec.food==='食べなかった'?' db-alert':''}">🍽️ ${rec.food}</span>`;
    if (rec.water)      badges += `<span class="dbadge db-water${rec.water==='飲まなかった'?' db-alert':''}">💧 ${rec.water}</span>`;
    if (rec.urine)      badges += `<span class="dbadge db-urine${rec.urine==='血尿あり'?' db-alert':''}">🚽 ${rec.urine}</span>`;
    if (rec.walk)       badges += `<span class="dbadge db-walk${rec.walk==='行きたがらない'?' db-alert':''}">🦮 ${rec.walk}</span>`;
    if (rec.imageUrl)   badges += `<span class="dbadge db-photo">📷 写真あり</span>`;
    if (rec.healthMemo) badges += `<span class="dbadge db-memo">📋 ${rec.healthMemo.length>18 ? rec.healthMemo.substring(0,18)+'…' : rec.healthMemo}</span>`;

    listHTML += `
      <div class="day-item${isAlert?' day-alert':''}" data-key="${key}" data-day="${d}">
        <div class="day-item-hd">
          <span class="day-item-date">${currentMonth}月${d}日（${dow}）${isAlert?'⚠️':''}</span>
          <span class="day-edit-hint">タップして編集 ✏️</span>
        </div>
        <div class="day-badges">${badges}</div>
      </div>
    `;
  }

  container.innerHTML = summaryHTML + listHTML;

  container.querySelectorAll('.day-item').forEach(el => {
    el.addEventListener('click', () => openModal(el.dataset.key, parseInt(el.dataset.day)));
  });
}

function renderCalendar() {
  document.getElementById('monthLabel').textContent = `${currentYear}年 ${MONTH_JP[currentMonth]}`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const firstDow = new Date(currentYear, currentMonth - 1, 1).getDay();
  const lastDate = new Date(currentYear, currentMonth, 0).getDate();

  for (let i = 0; i < firstDow; i++) {
    const blank = document.createElement('div');
    blank.className = 'cal-cell empty';
    grid.appendChild(blank);
  }

  for (let d = 1; d <= lastDate; d++) {
    const key = fmt(currentYear, currentMonth, d);
    const rec = dayCache[key];
    const isToday    = key === todayKey;
    const hasFilaria = !!rec?.filaria;
    const hasWeight  = !!rec?.weight;
    const hasPhoto   = !!rec?.imageUrl;
    const hasHealth  = rec && (rec.food || rec.water || rec.urine || rec.walk || rec.healthMemo);
    const isAlert    = rec && (rec.food === '食べなかった' || rec.water === '飲まなかった' || rec.urine === '血尿あり' || rec.walk === '行きたがらない');
    const hasAny     = hasFilaria || hasWeight || hasHealth || hasPhoto;

    const dow = (firstDow + d - 1) % 7;
    let dateColor = '#555';
    if (dow === 0) dateColor = '#E53935';
    if (dow === 6) dateColor = '#1E88E5';
    if (isToday)   dateColor = '#1565C0';

    let dots = '';
    if (hasFilaria) dots += '<span class="cal-dot dot-filaria"></span>';
    if (hasWeight)  dots += '<span class="cal-dot dot-weight"></span>';
    if (isAlert)    dots += '<span class="cal-dot dot-alert"></span>';
    else if (hasHealth) dots += '<span class="cal-dot dot-health"></span>';

    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (isToday ? ' today' : '') + (hasAny ? ' has-data' : '');
    cell.innerHTML = `
      <div class="cal-date" style="color:${dateColor}">${d}</div>
      <div class="cal-dots">${dots}</div>
      ${hasPhoto ? '<div class="cal-camera">📷</div>' : ''}
    `;
    cell.addEventListener('click', () => openModal(key, d));
    grid.appendChild(cell);
  }
}

function openModal(key, day) {
  currentModalDate = key;
  const rec = dayCache[key] || {};
  const dow = DOW_JP[new Date(currentYear, currentMonth-1, day).getDay()];
  document.getElementById('modalTitle').textContent = `${currentMonth}月${day}日（${dow}）の記録`;

  document.getElementById('filariaCheck').checked = !!rec.filaria;
  setWeightState(rec.weight || null);
  setChoice('foodGroup',  rec.food  || null);
  setChoice('waterGroup', rec.water || null);
  setChoice('urineGroup', rec.urine || null);
  setChoice('walkGroup',  rec.walk  || null);
  setPhotoState(rec.imageUrl || null);
  document.getElementById('healthMemoInput').value = rec.healthMemo || '';

  const hasAny = rec.filaria || rec.weight || rec.food || rec.water || rec.urine || rec.walk || rec.imageUrl || rec.healthMemo;
  document.getElementById('deleteBtn').style.display = hasAny ? 'block' : 'none';
  document.getElementById('modalOverlay').classList.remove('hidden');
  document.getElementById('modalBody').scrollTop = 0;
}

function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
  currentModalDate = null;
}

async function saveRecord() {
  if (!currentModalDate) return;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '保存中...';
  try {
    const filaria    = document.getElementById('filariaCheck').checked;
    const weight     = weightEnableEl.checked ? weightValueEl.textContent : null;
    const food       = getChoice('foodGroup');
    const water      = getChoice('waterGroup');
    const urine      = getChoice('urineGroup');
    const walk       = getChoice('walkGroup');
    const healthMemo = document.getElementById('healthMemoInput').value.trim();
    const imageUrl   = await handlePhotoSave();

    const data = {};
    if (filaria)    data.filaria    = true;
    if (weight)     data.weight     = weight;
    if (food)       data.food       = food;
    if (water)      data.water      = water;
    if (urine)      data.urine      = urine;
    if (walk)       data.walk       = walk;
    if (imageUrl)   data.imageUrl   = imageUrl;
    if (healthMemo) data.healthMemo = healthMemo;

    if (Object.keys(data).length === 0) { alert('何か入力してから記録してください。'); return; }
    await db.collection('filaria').doc(currentModalDate).set(data);
    closeModal();
  } catch(e) {
    console.error(e);
    alert('保存に失敗しました。\n' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '✨ 記録する';
    photoProgressEl.textContent = '';
  }
}

async function deleteRecord() {
  if (!currentModalDate) return;
  if (!confirm('この日の記録を削除しますか？')) return;
  try {
    const rec = dayCache[currentModalDate];
    if (rec?.imageUrl) {
      try { await storage.refFromURL(rec.imageUrl).delete(); } catch(e) { /* 無視 */ }
    }
    await db.collection('filaria').doc(currentModalDate).delete();
    closeModal();
  } catch(e) { alert('削除に失敗しました。\n' + e.message); }
}

document.getElementById('prevYear').addEventListener('click',  () => { currentYear--; loadYearData(); });
document.getElementById('nextYear').addEventListener('click',  () => { currentYear++; loadYearData(); });
document.getElementById('prevMonth').addEventListener('click', () => {
  if (currentMonth === 1)  { currentMonth = 12; currentYear--; loadYearData(); }
  else { currentMonth--; renderCalendar(); renderMonthSummary(); }
});
document.getElementById('nextMonth').addEventListener('click', () => {
  if (currentMonth === 12) { currentMonth = 1; currentYear++; loadYearData(); }
  else { currentMonth++; renderCalendar(); renderMonthSummary(); }
});
document.getElementById('saveBtn').addEventListener('click',    saveRecord);
document.getElementById('deleteBtn').addEventListener('click',  deleteRecord);
document.getElementById('modalCancel').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

function setConn(state, html) {
  const el = document.getElementById('connPill');
  el.className = `conn-pill conn-${state}`;
  el.innerHTML = html;
}

loadYearData();
</script>
</body>
</html>
